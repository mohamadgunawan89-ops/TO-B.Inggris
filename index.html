<style>
:root{
  --navy:#1F4E79; --navy-2:#163A5C; --teal:#0F8B8D; --amber:#E9A23B; --red:#C0392B; --green:#27AE60;
  --ink:#1C2430; --ink-2:#4A5563; --ink-3:#7A8595; --line:#D9DFE7; --bg:#F2F5F9; --card:#FFFFFF; --soft:#E8EEF6;
  --radius:14px; --shadow:0 1px 2px rgba(20,40,70,.06),0 6px 20px rgba(20,40,70,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{margin:0 0 .4em;line-height:1.25;text-wrap:balance}
h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1.05rem}
p{margin:0 0 .8em}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:.7em 1.1em;background:var(--navy);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:var(--soft);color:var(--navy)}
button.warn{background:var(--red)}
button.ok{background:var(--green)}
button.small{padding:.45em .8em;font-size:.9rem;font-weight:500}
input,select,textarea{font:inherit;width:100%;padding:.65em .8em;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid rgba(15,139,141,.35);outline-offset:1px}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.muted{color:var(--ink-2);font-size:.93rem}
.tiny{color:var(--ink-3);font-size:.8rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.hidden{display:none!important}
.badge{display:inline-block;padding:.15em .6em;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--soft);color:var(--navy);letter-spacing:.02em}
.badge.teal{background:#DDF3F3;color:#0B6B6D}
.badge.amber{background:#FBEBD0;color:#8A5A0E}
.badge.red{background:#F8DEDA;color:#8E2419}
.badge.green{background:#DDF5E5;color:#1B6B3A}
/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px}
.topbar .title{font-weight:700;font-size:.95rem;line-height:1.2}
.topbar .sub{font-size:.75rem;opacity:.85}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:1.15rem;background:rgba(255,255,255,.12);padding:.3em .7em;border-radius:8px}
.timer.low{background:var(--red)}
/* start */
.hero{background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;border-radius:var(--radius);padding:22px 20px;margin-bottom:14px}
.hero h1{color:#fff;font-size:1.45rem}
.hero .kv{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;opacity:.95;margin-top:8px}
.field{margin-bottom:12px}
.field label{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
ol.instr{padding-left:1.2em;margin:0}
ol.instr li{margin-bottom:.45em}
/* exam */
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 10px}
.progress > i{display:block;height:100%;background:var(--teal);transition:width .3s}
.passage{background:#FBFCFE;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.passage h3{font-size:1rem;color:var(--navy)}
.passage .body p{text-align:justify;hyphens:auto}
.passage img{width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.passage.collapsed .body{display:none}
.passage .toggle{margin-top:6px}
.adbox{background:#FFF8E8;border:1px dashed var(--amber);border-radius:10px;padding:12px;margin:10px 0;font-size:.95rem;white-space:pre-line}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.qnum{font-weight:700;color:var(--navy)}
.stem{font-size:1.02rem;margin-bottom:10px}
.note{color:var(--red);font-style:italic;font-size:.9rem;margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;cursor:pointer;transition:border-color .15s,background .15s}
.opt:active{transform:scale(.995)}
.opt .letter{flex:0 0 28px;height:28px;border-radius:50%;background:var(--soft);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.opt.sel{border-color:var(--teal);background:#EEF8F8}
.opt.sel .letter{background:var(--teal);color:#fff}
.opt .txt{flex:1}
.kat{width:100%;border-collapse:collapse;font-size:.95rem}
.kat th,.kat td{border:1px solid var(--line);padding:8px 6px;vertical-align:middle}
.kat th{background:var(--soft);font-size:.82rem;text-align:center}
.kat td.c{text-align:center;width:22%}
.kat td.c button{width:100%;padding:.5em 0;background:#fff;border:1.5px solid var(--line);color:var(--ink-2);font-weight:500}
.kat td.c button.sel{background:var(--teal);border-color:var(--teal);color:#fff}
.navbtns{display:flex;gap:10px;margin-top:14px}
.navbtns button{flex:1}
.palette{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:10px}
.palette button{padding:0;height:34px;border-radius:8px;background:#fff;border:1.5px solid var(--line);color:var(--ink-2);font-weight:600;font-size:.85rem}
.palette button.done{background:var(--soft);border-color:var(--navy);color:var(--navy)}
.palette button.cur{outline:3px solid var(--teal);outline-offset:-1px}
.fab{position:fixed;right:14px;bottom:18px;z-index:15;border-radius:999px;padding:.6em 1em;box-shadow:0 6px 18px rgba(0,0,0,.2);background:var(--navy-2);font-size:.9rem}
/* result */
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.score .box{background:var(--soft);border-radius:12px;padding:14px;text-align:center}
.score .box b{display:block;font-size:2rem;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:150px 1fr 48px;gap:8px;align-items:center;margin:6px 0;font-size:.92rem}
.bar .track{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--teal)}
.bar .track i.lo{background:var(--red)}.bar .track i.mid{background:var(--amber)}
.bar .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.tbl th{background:var(--soft);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2)}
table.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
.map{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.map span{height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.85rem;color:#fff}
.map .ok{background:var(--green)}.map .no{background:var(--red)}.map .na{background:var(--ink-3)}
.exp{border-left:4px solid var(--teal);background:#F7FBFB;padding:10px 12px;border-radius:0 10px 10px 0;margin:8px 0;font-size:.93rem}
.exp.wrong{border-color:var(--red);background:#FCF5F4}
.status{padding:10px 12px;border-radius:10px;font-size:.9rem;margin:10px 0}
.status.ok{background:#DDF5E5;color:#1B6B3A}.status.warn{background:#FBEBD0;color:#8A5A0E}.status.err{background:#F8DEDA;color:#8E2419}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;word-break:break-all;background:#F4F6F9;border:1px solid var(--line);border-radius:8px;padding:8px}
/* teacher */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{white-space:nowrap;background:var(--soft);color:var(--navy);padding:.5em .9em;font-size:.9rem}
.tabs button.act{background:var(--navy);color:#fff}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi .box{background:var(--soft);border-radius:12px;padding:12px;text-align:center}
.kpi .box b{display:block;font-size:1.5rem;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi .box span{font-size:.78rem;color:var(--ink-2)}
.switch{display:flex;align-items:center;gap:10px;padding:10px 0}
.switch input{width:auto;transform:scale(1.3)}
footer{text-align:center;padding:20px;color:var(--ink-3);font-size:.8rem}
footer a{color:var(--navy)}
@media (min-width:640px){.wrap{padding:24px}.palette{grid-template-columns:repeat(15,1fr)}.map{grid-template-columns:repeat(15,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script id="data" type="application/json">{"texts":[{"n":1,"type":"Narrative","level":"B1","title":"The Two Fishermen of Muara Village","body":"Long ago, in a small village by the sea, there lived two young fishermen named Darma and Kasim. They were best friends who fished together every morning. Darma was patient and careful, while Kasim was quick and always wanted to catch the most fish.\n\nOne day, an old woman came to the beach and asked for some fish because her family had nothing to eat. Darma gave her three of his biggest fish without thinking twice. Kasim laughed and said, \"You will never become rich if you give everything away.\" The old woman thanked Darma and said, \"Kindness always returns, though you may not see it coming.\"\n\nThe next morning, a terrible storm hit the village. The two friends were far out at sea when the waves grew high. Their boat was thrown against the rocks and broke apart. Darma and Kasim swam to a small island and waited for help. They had no food, no water, and no way to send a message.\n\nOn the third day, a fishing boat appeared. The captain was the old woman's son. His mother had told him about the kind fisherman and asked him to look for the missing boat. He brought the two friends home safely.\n\nBack in the village, Kasim was silent for a long time. Finally he said, \"I was wrong. Your three fish saved both of our lives.\" From that day, Kasim always shared part of his catch with people in need. The two friends built a new boat together, and the villagers say that their nets were never empty again."},{"n":2,"type":"Procedure (Infographic)","level":"A2","title":null,"img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA+gAAAQ3CAMAAABcsrSiAAAAkFBMVEX///////77///+/v79/f36/P74+f33+f33+fz9/Ov0+vv/997/9Nf/9Nb/9NX/89P29/n889346b/zyjzo37S1z8jojDvmfiPmfiLmfiGopJdilKayciBcZWgrr2MnrmEnrmAnrl8mrl8ionMvhsEuhsIuhsEthsEjap83OkIfT3kfTnofTnkfTngfISQVM04gGihhAAD7AUlEQVR42uy9C1vjOq82nBk7zyqltE4nLkOyAvNy8S1IGbr//7/7LMnHHHqAAqVIz95rSuI4tuLbkm  come in. There is a long wooden table near the window, covered with rolls of cloth in many colours: red, green, dark blue, and soft cream. On the wall, Bu Rina hangs photos of school uniforms, wedding dresses, and batik shirts she has made. Two comfortable chairs stand near the door for customers who are waiting. A small mirror lets people check how their new clothes look.\n\nBehind a curtain is the work room. Here, three sewing machines stand in a row, and their sound can be heard all day. Boxes of buttons, zippers, and thread are neatly arranged on a shelf. A large ironing board stands in the corner. Bu Rina works with two helpers, Dewi and Anto, who are both graduates of a vocational school.\n\nBu Rina is a small woman with grey hair and a warm smile. She has been a tailor for more than twenty years. She is famous in our town because she works carefully and always finishes on time. Many teachers and students order their uniforms from her. \"A good tailor listens first, then sews,\" she often says. Her shop may be simple, but it is one of the most loved places in our neighbourhood."},{"n":4,"type":"Recount","level":"B1","title":"My Work Experience at Hotel Cempaka","body":"In March, our vocational class sent me to Hotel Cempaka for a two-week work placement at the front desk. I had studied hotel service theory for a year, but this was the first time I would face real guests. I was nervous, especially about speaking English with foreign visitors.\n\nOn the first day, the front office manager, Mr. Hadi, gave me a uniform and a name tag. He explained the check-in system and asked me to observe first. For two days, I only watched the staff, took notes, and answered the phone when it was quiet. It was boring at times, but I learned how the team welcomed every guest with the same friendly greeting.\n\nIn the second week, I was allowed to handle check-ins on my own. One afternoon, a family from Australia arrived, but their room was not ready because the previous guest had left late. The father looked tired and unhappy. I remembered my training: apologize, offer a solution, and stay calm. I apologized, offered them free drinks in the lobby, and promised to call them as soon as the room was ready. Forty minutes later, I brought them their keys myself. The father shook my hand and said I had handled it well.\n\nOn my last day, Mr. Hadi gave me an evaluation. He said my English had improved a lot and that I was good at staying calm under pressure. However, he also said I needed to be faster with the computer system. He gave me a reference letter and told me to apply for a part-time job after graduation.\n\nThe placement changed the way I saw my future. Before, I thought hotel work was only about smiling at guests. Now I know it is about solving problems quickly while keeping people comfortable. I am now practising typing every evening."},{"n":5,"type":"Analytical Exposition","level":"B1","title":"School Canteens Should Stop Using Single-Use Plastic","body":"Every day, millions of Indonesian students buy food and drinks at school canteens. Most of these snacks come in plastic wrappers, cups, and straws that are used once and thrown away. I believe that school canteens should stop using single-use plastic, and there are three strong reasons for this.\n\nFirst, plastic waste is a serious problem for our environment. Indonesia produces about 7.8 million tonnes of plastic waste every year, and much of it ends up in rivers and the sea. A plastic straw can take up to 200 years to break down. When thousands of students use plastic every day, a school can produce several bags of plastic rubbish before lunch is over.\n\nSecond, reducing plastic teaches students good habits. School is not only a place to learn mathematics and science; it is also a place to learn how to live responsibly. If students get used to bringing their own bottles and food containers, they will probably continue this habit at home and in the future. In my opinion, this lesson is as important as any subject in the curriculum.\n\nThird, the change is not difficult or expensive. Some schools in Bandung and Surabaya have already replaced plastic cups with washable glasses and asked sellers to use paper or banana-leaf wrapping. Students in these schools report that the canteen looks cleaner and that they feel proud of their school. The cost of washable glasses is paid back within a few months because the canteen no longer needs to buy plastic cups.\n\nSome people argue that plastic is cheaper and more practical. This may be true in the short term, but the cost of cleaning rivers and beaches is far greater. Others say students will forget to bring their bottles. However, habits take time, and schools can provide water stations to help.\n\nIn conclusion, banning single-use plastic in school canteens protects the environment, builds good habits, and is affordable. Schools should start now, before the problem becomes even bigger."}],"questions":[{"n":1,"t":1,"lvl":"Pemahaman Tekstual","sub":"Membuat kerangka","type":"PG","q":"Which of the following outlines shows the correct main points of the story?","exp":"Kerangka yang benar harus memuat lima peristiwa utama secara berurutan dan akurat: perbedaan karakter, pemberian ikan oleh Darma, badai dan terdampar, penyelamatan oleh anak wanita tua, dan perubahan sikap Kasim. Opsi lain memuat detail yang salah (Darma menjual ikan, mereka bersaudara, Kasim yang memberi ikan, keduanya menolak).","opts":["Two fishermen were friends. Darma sold fish to an old woman. A storm destroyed the village. The old woman's son became a fisherman. Kasim moved to another village.","Two fishermen had different characters. Darma gave fish to a poor old woman while Kasim laughed. A storm broke their boat and they were stranded. The old woman's son rescued them. Kasim changed and began to share.","Darma and Kasim were brothers. They argued about who should give fish to the old woman. Their boat sank in the storm. Darma saved Kasim by swimming. They never fished again.","Kasim gave his fish to an old woman. Darma laughed at him. They were caught in a storm. A captain found them. Darma learned to share his catch.","Two fishermen met an old woman. They both refused to give her fish. The woman cursed them with a storm. They were lost at sea forever. The village learned a lesson."],"key":1},{"n":2,"t":1,"lvl":"Pemahaman Inferensial","sub":"Menyimpulkan hubungan sebab-akibat","type":"PG","q":"Why did the captain search for the two fishermen?","exp":"Teks menyatakan: \"His mother had told him about the kind fisherman and asked him to look for the missing boat.\" Kebaikan Darma menjadi sebab, penyelamatan menjadi akibat.","opts":["He was a close friend of Kasim.","He wanted to sell them a new boat.","His mother asked him to find the kind fisherman who had helped her.","The village leader ordered every boat to search.","He saw the boat break apart from the shore."],"key":2},{"n":3,"t":1,"lvl":"Pemahaman Inferensial","sub":"Menyimpulkan perbandingan","type":"KAT","q":"Darma and Kasim are different, but they also have some similarities. Decide whether each statement shows a similarity or a difference between them.","exp":"A dan C berlaku bagi keduanya (persamaan). B adalah perbedaan: di awal cerita hanya Darma yang peduli, sedangkan Kasim menertawakannya.","cols":["Similarity","Difference"],"rows":["They are young fishermen from the same village.","At the beginning of the story, they care about people in need.","They survive the storm together on the island."],"key":[0,1,0]},{"n":4,"t":1,"lvl":"Pemahaman Inferensial","sub":"Memprediksi hasil cerita","type":"PG","q":"Based on the ending of the story, what will Kasim most likely do the next time a poor person asks him for fish?","exp":"Akhir cerita menyatakan Kasim \"always shared part of his catch with people in need\", sehingga prediksi yang konsisten adalah ia akan memberi tanpa pamrih.","opts":["Refuse and tell the person to work harder.","Give some of his fish without expecting anything back.","Ask Darma to give his fish instead.","Sell the fish at a lower price.","Report the person to the village leader."],"key":1},{"n":5,"t":1,"lvl":"Pemahaman Inferensial","sub":"Menyimpulkan karakter tokoh","type":"MCMA","q":"Which words best describe Darma's character in the story?","exp":"Teks eksplisit menyebut Darma \"patient and careful\", dan tindakannya memberi tiga ikan terbesar menunjukkan sifat dermawan (generous). Greedy dan proud tidak didukung teks.","opts":["Generous","Patient","Greedy","Careful","Proud"],"key":[0,1,3]},{"n":6,"t":1,"lvl":"Evaluasi dan Apresiasi","sub":"Menilai realitas atau fantasi","type":"PG","q":"Which part of the story is LEAST likely to happen in real life?","exp":"Pernyataan \"nets were never empty again\" adalah unsur legenda/berlebihan yang tidak mungkin terjadi secara nyata; peristiwa lainnya realistis.","opts":["Two friends going fishing together every morning.","A boat breaking on the rocks during a storm.","Fishermen's nets that are never empty again.","A captain rescuing people stranded on an island.","An old woman asking for fish for her family."],"key":2},{"n":7,"t":2,"lvl":"Pemahaman Tekstual","sub":"Mengklasifikasi","type":"KAT","q":"The following activities are suggested in the infographic. Categorize each activity as Preparation or Follow-up.","exp":"Sesuai kolom infografis: menulis ringkasan dan mendaftar topik yang masih perlu bantuan ada di kolom AFTER (Follow-up); menyepakati waktu dan tempat ada di kolom BEFORE (Preparation).","cols":["Preparation","Follow-up"],"rows":["Writing a short summary of what you learned","Agreeing on a time and a place","Listing topics that still need help"],"key":[1,0,1]},{"n":8,"t":2,"lvl":"Pemahaman Tekstual","sub":"Menemukan/mengidentifikasi informasi","type":"MCMA","q":"According to the infographic, what should students prepare or bring before a study group meeting?","exp":"Poin 3 dan 4 pada kolom BEFORE menyebut: prepare questions about difficult topics; bring notes, textbook, and stationery. Snack dan laptop tidak disebut.","opts":["Their notes and textbook","A list of questions about difficult topics","Snacks for all members","A laptop for every member","Stationery"],"key":[0,1,4]},{"n":9,"t":2,"lvl":"Pemahaman Inferensial","sub":"Menyimpulkan target pembaca","type":"PG","q":"Who is this infographic mainly intended for?","exp":"Judul dan subjudul (\"For Grade 10-12 students\") serta isi berupa langkah bagi anggota kelompok menunjukkan target pembaca adalah siswa.","opts":["Students who want to study together effectively","Teachers who plan group work in class","Librarians who manage the discussion room","Parents who want to help children study at home","Tutors who teach private lessons"],"key":0},{"n":10,"t":2,"lvl":"Pemahaman Inferensial","sub":"Menyimpulkan hubungan sebab-akibat","type":"MCMA","q":"Based on the infographic, which of the following may cause a study group to fail?","exp":"Kotak DON'T menjelaskan akibatnya: kelompok lebih dari 6 orang kehilangan fokus, tanpa istirahat otak lelah, tanpa ringkasan mudah lupa. B dan D justru langkah yang dianjurkan.","opts":["Having eight members in the group","Taking turns explaining a topic","Studying for two hours without a break","Sharing the summary in the group chat","Leaving without writing a summary"],"key":[0,2,4]},{"n":11,"t":2,"lvl":"Evaluasi dan Apresiasi","sub":"Menanggapi isi teks","type":"PG","q":"You have just read this infographic in the school library. What will you most likely do before your next study group meeting?","exp":"Respons yang sesuai dengan pesan infografis untuk tahap persiapan adalah menyiapkan pertanyaan tentang topik sulit. Opsi lain bertentangan dengan anjuran (lebih dari 6 orang, mematikan grup chat) atau tidak relevan.","opts":["Prepare a list of difficult topics that you want to ask about.","Invite ten classmates so the discussion is more lively.","Buy snacks and drinks for all members.","Write a summary of the last meeting during the session.","Turn off the group chat so nobody is disturbed."],"key":0},{"n":12,"t":3,"lvl":"Pemahaman Tekstual","sub":"Mengklasifikasi","type":"KAT","q":"Where can the following things be found in Bu Rina's shop? Categorize each item as Front room or Work room.","exp":"Paragraf 2 (front room) menyebut rolls of cloth dan photos; paragraf 3 (work room) menyebut ironing board.","cols":["Front room","Work room"],"rows":["Rolls of cloth in many colours","A large ironing board","Photos of uniforms and wedding dresses"],"key":[0,1,0]},{"n":13,"t":3,"lvl":"Pemahaman Inferensial","sub":"Menyimpulkan ide pokok","type":"PG","q":"What is the main idea of the last paragraph?","exp":"Paragraf terakhir berpusat pada alasan Bu Rina dikenal dan dicintai: pengalaman 20 tahun, bekerja teliti, dan selalu tepat waktu. Opsi A hanya detail; C, D, E tidak didukung teks.","opts":["Bu Rina has grey hair and a warm smile.","Bu Rina is respected because of her skill, care, and punctuality.","Teachers and students only buy uniforms from Bu Rina.","Bu Rina's shop needs to be renovated.","Bu Rina wants to open a bigger shop in town."],"key":1},{"n":14,"t":3,"lvl":"Pemahaman Tekstual","sub":"Meringkas","type":"PG","q":"Which of the following is the best summary of the text?","exp":"Ringkasan yang baik mencakup gambaran umum toko (dua ruang) dan sosok Bu Rina. Opsi B, C, E hanya sebagian, dan opsi D hanya satu paragraf.","opts":["Bu Rina's small tailor shop has a busy front room for customers and a work room with three machines; she is loved because she is skilful and reliable.","Bu Rina's shop is next to a bakery, and the smell of bread makes customers come every morning to buy cloth.","Bu Rina, Dewi, and Anto studied at a vocational school and now make wedding dresses for people in the town.","The front room of the shop has a wooden table, chairs, a mirror, and colourful cloth for customers to buy.","Bu Rina has worked for twenty years and believes a tailor should listen before sewing."],"key":0},{"n":15,"t":3,"lvl":"Evaluasi dan Apresiasi","sub":"Menilai kesesuaian","type":"MCMA","q":"Which parts of the text best support the idea that Bu Rina is a trusted tailor?","exp":"Kepercayaan pelanggan didukung oleh pengalaman panjang, cara kerja teliti dan tepat waktu, serta banyaknya pelanggan. Opsi B dan E hanya deskripsi lingkungan.","opts":["She has been a tailor for more than twenty years.","A blue sign with white letters hangs above the door.","She works carefully and always finishes on time.","Many teachers and students order their uniforms from her.","The smell of fresh bread fills the air every morning."],"key":[0,2,3]},{"n":16,"t":3,"lvl":"Evaluasi dan Apresiasi","sub":"Menilai kecukupan dan validitas informasi","type":"PG","q":"A student wants to order a school uniform from Bu Rina after reading the text. Which important information is NOT provided in the text?","exp":"Teks menyebut lokasi (Jalan Melati), jenis pakaian, nama pembantu, dan lama bekerja, tetapi tidak menyebut harga maupun lama pengerjaan; informasi ini penting bagi calon pelanggan.","opts":["Where the shop is located","What kinds of clothes Bu Rina makes","How much a uniform costs and how long it takes","Who helps Bu Rina in the shop","How long Bu Rina has worked as a tailor"],"key":2},{"n":17,"t":4,"lvl":"Pemahaman Tekstual","sub":"Menemukan/mengidentifikasi informasi","type":"PG","q":"What did the writer do during the first two days of the placement?","exp":"Paragraf 2: \"For two days, I only watched the staff, took notes, and answered the phone when it was quiet.\"","opts":["Handled check-ins on his own and gave keys to guests.","Watched the staff, took notes, and answered the phone.","Practised typing and studied the computer system.","Welcomed a family from Australia in the lobby.","Wrote a reference letter for Mr. Hadi."],"key":1},{"n":18,"t":4,"lvl":"Pemahaman Inferensial","sub":"Menyimpulkan urutan kejadian","type":"PG","q":"What did the writer do right after apologizing to the Australian family?","exp":"Urutan dalam teks: apologized → offered free drinks → promised to call → forty minutes later brought the keys. Jadi tindakan tepat setelah meminta maaf adalah menawarkan minuman gratis.","opts":["Brought them their room keys.","Offered them free drinks in the lobby.","Asked Mr. Hadi to talk to the father.","Told the previous guest to leave quickly.","Gave the family a reference letter."],"key":1},{"n":19,"t":4,"lvl":"Pemahaman Inferensial","sub":"Menyimpulkan karakter tokoh","type":"MCMA","q":"Which words best describe the writer's personality during the placement?","exp":"Penanganan keluarga Australia menunjukkan ketenangan; berlatih mengetik setiap malam menunjukkan kemauan belajar; menepati janji mengantar kunci sendiri menunjukkan tanggung jawab. C dan E bertentangan dengan teks.","opts":["Calm under pressure","Willing to learn","Impatient with guests","Responsible","Careless with details"],"key":[0,1,3]},{"n":20,"t":4,"lvl":"Pemahaman Inferensial","sub":"Menyimpulkan hubungan sebab-akibat","type":"MCMA","q":"What were the effects of the work placement on the writer?","exp":"Paragraf 4 dan 5 menyebut: English improved, changed the way I saw my future, dan practising typing. Pekerjaan penuh waktu dan cita-cita manajer tidak disebut.","opts":["The writer's English improved.","The writer now practises typing every evening.","The writer got a full-time job at the hotel.","The writer changed the way he sees hotel work.","The writer decided to become a hotel manager."],"key":[0,1,3]},{"n":21,"t":4,"lvl":"Pemahaman Tekstual","sub":"Mensintesis","type":"PG","q":"Read the job advertisement above. Based on the text AND the advertisement, which requirement does the writer still need to improve before applying?","exp":"Sintesis dua sumber: iklan mensyaratkan \"fast and accurate computer skills\", sedangkan evaluasi Mr. Hadi menyatakan penulis \"needed to be faster with the computer system\". Bahasa Inggris dinilai sudah membaik.","opts":["Good spoken English","Fast and accurate computer skills","A hospitality qualification","A friendly greeting for guests","Willingness to work on weekends"],"key":1,"extra":"HOTEL CEMPAKA – NOW HIRING\nPart-time Front Desk Assistant\nRequirements: SMK graduate in Hospitality • Good spoken English • Fast and accurate computer skills • Willing to work on weekends\nSend your CV and a reference letter to hrd@hotelcempaka.example"},{"n":22,"t":4,"lvl":"Evaluasi dan Apresiasi","sub":"Menilai fakta atau opini","type":"PG","q":"Which statement from the text is an OPINION rather than a fact?","exp":"\"It was boring at times\" adalah penilaian subjektif penulis; pernyataan lain adalah peristiwa yang dapat diverifikasi.","opts":["Our vocational class sent me to Hotel Cempaka for two weeks.","Mr. Hadi gave me a uniform and a name tag.","It was boring at times.","A family from Australia arrived one afternoon.","He gave me a reference letter."],"key":2},{"n":23,"t":5,"lvl":"Pemahaman Tekstual","sub":"Menemukan/mengidentifikasi informasi","type":"MCMA","q":"According to the text, what have some schools in Bandung and Surabaya already done?","exp":"Paragraf 4 menyebut dua tindakan: mengganti gelas plastik dengan gelas cuci ulang dan meminta penjual memakai pembungkus kertas/daun pisang. Water station hanya disebut sebagai saran.","opts":["Replaced plastic cups with washable glasses","Banned all snacks from the canteen","Asked sellers to use paper or banana-leaf wrapping","Closed their canteens for a month","Built water stations in every classroom"],"key":[0,2]},{"n":24,"t":5,"lvl":"Pemahaman Tekstual","sub":"Membuat kerangka","type":"PG","q":"Which outline best represents the structure of the text?","exp":"Struktur analytical exposition: thesis, tiga argumen, tanggapan terhadap pendapat lawan, dan reiterasi/kesimpulan. Opsi lain memutarbalikkan posisi penulis atau bukan struktur teks ini.","opts":["Thesis: canteens should stop using plastic – Argument 1: environment – Argument 2: good habits – Argument 3: affordable – Response to objections – Conclusion","Introduction: plastic is popular – Argument 1: plastic is cheap – Argument 2: students forget bottles – Conclusion: plastic should stay","Thesis: schools in Bandung are the best – Argument 1: washable glasses – Argument 2: banana leaves – Conclusion: copy Bandung","Problem: students are hungry – Solution 1: more canteens – Solution 2: cheaper food – Conclusion: build water stations","Story: a student brings a bottle – Event 1: friends laugh – Event 2: school bans plastic – Ending: everyone is happy"],"key":0},{"n":25,"t":5,"lvl":"Pemahaman Inferensial","sub":"Menyimpulkan tujuan penulisan teks","type":"PG","q":"What is the writer's main purpose in writing the text?","exp":"Frasa \"I believe that school canteens should stop...\" dan struktur argumentatif menunjukkan tujuan meyakinkan pembaca (persuasi).","opts":["To describe how plastic is produced in Indonesia","To tell a story about a school canteen","To persuade readers that school canteens should stop using single-use plastic","To explain how to wash glasses in a canteen","To compare canteens in Bandung and Surabaya"],"key":2},{"n":26,"t":5,"lvl":"Pemahaman Inferensial","sub":"Menyimpulkan detail pendukung","type":"MCMA","q":"Which additional facts would most likely make the text more persuasive?","exp":"Data, pendapat ahli, dan perbandingan biaya langsung memperkuat ketiga argumen penulis. Daftar camilan dan sejarah plastik tidak relevan dengan argumen.","opts":["Survey data showing how many bags of plastic waste one school produces in a week","A list of the most popular snacks sold in school canteens","A statement from an environmental expert about plastic in rivers","The history of when plastic was first invented","A comparison of the yearly cost of plastic cups and washable glasses"],"key":[0,2,4]},{"n":27,"t":5,"lvl":"Evaluasi dan Apresiasi","sub":"Menilai fakta atau opini","type":"KAT","q":"Decide whether each statement from the text is a fact or an opinion.","exp":"A dan C adalah data yang dapat diverifikasi (fakta). B diawali \"In my opinion\" dan merupakan penilaian (opini).","cols":["Fact","Opinion"],"rows":["A plastic straw can take up to 200 years to break down.","This lesson is as important as any subject in the curriculum.","Indonesia produces about 7.8 million tonnes of plastic waste every year."],"key":[0,1,0]},{"n":28,"t":5,"lvl":"Evaluasi dan Apresiasi","sub":"Menilai kecukupan dan validitas informasi","type":"MCMA","q":"A careful reader checks whether the writer's evidence is strong enough. Which of the following are weaknesses in the writer's evidence?","exp":"Bukti yang kuat memerlukan sumber dan jumlah. Teks tidak menyebut sumber data, jumlah sekolah, maupun angka pendukung laporan siswa. Opsi C dan D salah karena teks memberi tiga alasan dan menjelaskan plastik sekali pakai di paragraf 1.","opts":["The writer does not say how many schools have made the change.","The writer does not mention the source of the 7.8 million tonnes figure.","The writer does not give any reason for banning plastic.","The writer does not explain what single-use plastic is.","The students' reports about cleaner canteens are not supported by numbers."],"key":[0,1,4]},{"n":29,"t":5,"lvl":"Pemahaman Inferensial","sub":"Menyimpulkan makna frasa","type":"PG","q":"What does the phrase \"paid back within a few months\" in paragraph 4 mean?","exp":"Konteks kalimat: biaya gelas tertutupi karena kantin tidak lagi membeli gelas plastik; artinya biaya awal \"kembali\" melalui penghematan.","opts":["The glasses break after a few months.","The money spent on glasses is recovered by saving on plastic cups.","The canteen must return the glasses to the seller.","Schools pay for the glasses every month.","Sellers pay the school for using the glasses."],"key":1},{"n":30,"t":5,"lvl":"Evaluasi dan Apresiasi","sub":"Menanggapi isi teks","type":"MCMA","q":"What impressions do you get from the text?","exp":"Kesan yang sesuai: kepedulian lingkungan (argumen 1), keyakinan bahwa sekolah membentuk kebiasaan (argumen 2), dan sifat praktis/terjangkau (argumen 3). Opsi B dan D bertentangan: penulis menyebut perubahan tidak sulit dan menanggapi pendapat lawan.","opts":["The writer strongly cares about the environment.","The writer thinks the change is impossible for most schools.","The writer believes schools can help change habits in society.","The writer ignores the views of people who disagree.","The writer presents the ban as practical, not only idealistic."],"key":[0,2,4]}]}</script>
<script>
(function(){
'use strict';
const DATA = JSON.parse(document.getElementById('data').textContent);
const TEXTS = DATA.texts, QS = DATA.questions;
const TOTAL = QS.length;
const LETTERS = "ABCDE";
const LEVELS = ["Pemahaman Tekstual","Pemahaman Inferensial","Evaluasi dan Apresiasi"];
const SERVER = (function(){ try{ const u=new URL(location.href); const s=u.searchParams.get('srv'); if(s && /^https:\/\/script\.google(usercontent)?\.com\//.test(s)) return s; }catch(e){} return (window.TKA_SERVER||"").trim(); })();
const LS = { state:'tka_en_state_v1', results:'tka_en_results_v1', settings:'tka_en_settings_v1' };
const app = document.getElementById('app');
const $ = (s,el)=> (el||document).querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qById = {}; QS.forEach(q=>qById[q.n]=q);
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }, del(k){ try{ localStorage.removeItem(k);}catch(e){} } };
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad(n){ return (n<10?'0':'')+n; }
function fmtTime(s){ s=Math.max(0,s); return pad(Math.floor(s/60))+':'+pad(s%60); }
function nowStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }

/* ---------- state ---------- */
let S = store.get(LS.state,null);
let timerId=null;

function newState(nama,kelas){
  const textOrder = shuffle(TEXTS.map(t=>t.n));
  const order=[]; const optOrder={};
  textOrder.forEach(tn=>{ shuffle(QS.filter(q=>q.t===tn).map(q=>q.n)).forEach(n=>order.push(n)); });
  QS.forEach(q=>{ if(q.type!=='KAT') optOrder[q.n]=shuffle(q.opts.map((_,i)=>i)); });
  return { id:uid(), nama, kelas, started:Date.now(), deadline:Date.now()+window.TKA_DURASI_MENIT*60000, order, optOrder, answers:{}, cur:0, done:false };
}

/* ---------- scoring ---------- */
function isCorrect(q,a){
  if(a==null) return false;
  if(q.type==='PG') return a===q.key;
  if(q.type==='MCMA'){ const s=(a||[]).slice().sort().join(','); return s===q.key.slice().sort().join(','); }
  if(q.type==='KAT'){ return q.rows.every((_,i)=> a[i]===q.key[i]); }
  return false;
}
function isAnswered(q,a){
  if(a==null) return false;
  if(q.type==='PG') return typeof a==='number';
  if(q.type==='MCMA') return Array.isArray(a)&&a.length>0;
  if(q.type==='KAT') return Array.isArray(a)&&q.rows.every((_,i)=>typeof a[i]==='number');
  return false;
}
function score(answers){
  const per={}; let sc=0; const lvl={}; const sub={}; const txt={};
  LEVELS.forEach(l=>lvl[l]={c:0,n:0});
  QS.forEach(q=>{
    const ok=isCorrect(q,answers[q.n]); per[q.n]=ok?1:0; if(ok)sc++;
    lvl[q.lvl].n++; if(ok)lvl[q.lvl].c++;
    sub[q.sub]=sub[q.sub]||{c:0,n:0,lvl:q.lvl}; sub[q.sub].n++; if(ok)sub[q.sub].c++;
    txt[q.t]=txt[q.t]||{c:0,n:0}; txt[q.t].n++; if(ok)txt[q.t].c++;
  });
  return { score:sc, nilai:Math.round(sc/TOTAL*100), per, lvl, sub, txt };
}
function buildResult(st){
  const r=score(st.answers);
  return { id:st.id, nama:st.nama, kelas:st.kelas, waktu:nowStr(), ts:Date.now(), durasi:Math.round((Date.now()-st.started)/60000), score:r.score, nilai:r.nilai, answers:st.answers, per:r.per,
    lvl:Object.fromEntries(LEVELS.map(l=>[l,r.lvl[l].n?Math.round(r.lvl[l].c/r.lvl[l].n*100):0])) };
}
function pct(c,n){ return n?Math.round(c/n*100):0; }
function cls(p){ return p<50?'lo':(p<75?'mid':''); }

/* ---------- server adapter ---------- */
async function serverSubmit(res){
  if(!SERVER) return {ok:false,mode:'local'};
  const body=JSON.stringify({action:'submit',result:res});
  try{
    const r=await fetch(SERVER,{method:'POST',body,redirect:'follow'});
    const j=await r.json(); return {ok:!!j.ok,mode:'server',msg:j.error};
  }catch(e){
    try{ await fetch(SERVER,{method:'POST',body,mode:'no-cors'}); return {ok:true,mode:'server-nocors'}; }catch(e2){ return {ok:false,mode:'server',msg:String(e2)}; }
  }
}
async function serverGet(params){
  if(!SERVER) return null;
  const u=new URL(SERVER); Object.keys(params).forEach(k=>u.searchParams.set(k,params[k]));
  const r=await fetch(u.toString(),{redirect:'follow'}); return r.json();
}

/* ---------- views ---------- */
function render(){
  if(location.hash==='#guru'){ return viewTeacherGate(); }
  if(!S) return viewStart();
  if(S.done) return viewResult();
  return viewExam();
}
window.addEventListener('hashchange',render);

function viewStart(){
  stopTimer();
  app.innerHTML=`<div class="wrap">
  <div class="hero"><div class="badge" style="background:rgba(255,255,255,.2);color:#fff">Tryout TKA 2026</div>
   <h1 style="margin-top:8px">Bahasa Inggris – SMA/MA</h1>
   <div>SMA Plus Merdeka Soreang</div>
   <div class="kv"><span>📝 ${TOTAL} soal</span><span>⏱ ${window.TKA_DURASI_MENIT} menit</span><span>📖 ${TEXTS.length} teks bacaan</span></div></div>
  <div class="card"><h2>Identitas Peserta</h2>

function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function startTimer(){
  stopTimer();
  const tick=()=>{
    const left=Math.round((S.deadline-Date.now())/1000);
    const el=$('#timer'); if(el){ el.textContent=fmtTime(left); el.classList.toggle('low',left<300); }
    if(left<=0){ stopTimer(); finish(true); }
  };
  tick(); timerId=setInterval(tick,1000);
}

async function finish(auto){
  stopTimer();
  if(S.done) return;
  S.done=true; S.finishedAt=Date.now(); S.auto=!!auto;
  const res=buildResult(S); S.result=res; store.set(LS.state,S);
  const all=store.get(LS.results,[]); if(!all.some(r=>r.id===res.id)) all.push(res); store.set(LS.results,all);
  S.sent={pending:true}; render();
  const out=await serverSubmit(res); S.sent=out;
  if(SERVER){ try{ const j=await serverGet({action:'settings'}); if(j&&j.ok) store.set(LS.settings,j.settings||{}); }catch(e){} }
  store.set(LS.state,S); render();
}

function encodeResult(res){
  const compact={v:1,id:res.id,n:res.nama,k:res.kelas,w:res.waktu,d:res.durasi,a:res.answers};
  return 'TKAEN.'+btoa(unescape(encodeURIComponent(JSON.stringify(compact)))).replace(/=+$/,'');
}
function decodeResult(code){
  code=code.trim(); if(!code.startsWith('TKAEN.')) throw new Error('Awalan kode salah');
  const j=JSON.parse(decodeURIComponent(escape(atob(code.slice(6)))));
  const r=score(j.a||{});
  return { id:j.id, nama:j.n, kelas:j.k, waktu:j.w, ts:Date.now(), durasi:j.d, score:r.score, nilai:r.nilai, answers:j.a, per:r.per, lvl:Object.fromEntries(LEVELS.map(l=>[l,pct(r.lvl[l].c,r.lvl[l].n)])), imported:true };
}

function keyLabel(q,ord){
  if(q.type==='PG') return LETTERS[ord.indexOf(q.key)];

  return q.rows.map((_,i)=>LETTERS[i]+'='+q.cols[q.key[i]]).join('; ');
}

    catch(e){ app.innerHTML=`<div class="wrap"><div class="status err">Gagal memuat data server: ${esc(e.message)}</div><a href="#">Kembali</a></div>`; return; }
  } else { results=store.get(LS.results,[]); settings=store.get(LS.settings,{showPembahasan:false}); }
  const tab=sessionStorage.getItem('tka_en_tab')||'siswa';
  const kelasFilter=sessionStorage.getItem('tka_en_kelas')||'';
  const kelasList=[...new Set(results.map(r=>r.kelas))].sort();
  const rows=results.filter(r=>!kelasFilter||r.kelas===kelasFilter).sort((a,b)=>a.kelas.localeCompare(b.kelas)||a.nama.localeCompare(b.nama));
  const n=rows.length, avg=n?Math.round(rows.reduce((s,r)=>s+r.nilai,0)/n):0;
  const lvlAvg=LEVELS.map(l=>n?Math.round(rows.reduce((s,r)=>s+(r.lvl[l]||0),0)/n):0);
  // item analysis
  const items=QS.map(q=>{ const c=rows.filter(r=>r.per&&r.per[q.n]).length; const p=pct(c,n); return {q,c,p,label:p>=75?'Mudah':p>=40?'Sedang':'Sukar'}; });
  const subAgg={}; QS.forEach(q=>{ subAgg[q.sub]=subAgg[q.sub]||{lvl:q.lvl,c:0,n:0}; rows.forEach(r=>{ subAgg[q.sub].n++; if(r.per&&r.per[q.n]) subAgg[q.sub].c++; }); });
  const subRows=Object.keys(subAgg).map(k=>({sub:k,lvl:subAgg[k].lvl,p:pct(subAgg[k].c,subAgg[k].n)})).sort((a,b)=>a.p-b.p);
  let content='';
  if(tab==='siswa'){
    content=`<div class="tscroll"><table class="tbl"><thead><tr><th>#</th><th>Nama</th><th>Kelas</th><th>Nilai</th><th>Benar</th><th>Teks.</th><th>Infer.</th><th>Eval.</th><th>Terlemah</th><th>Waktu</th></tr></thead><tbody>
     ${rows.map((r,i)=>{ const weak=weakestSub(r); return `<tr><td>${i+1}</td><td>${esc(r.nama)}${r.imported?' <span class="badge">impor</span>':''}</td><td>${esc(r.kelas)}</td><td class="n"><b>${r.nilai}</b></td><td class="n">${r.score}/${TOTAL}</td><td class="n">${r.lvl[LEVELS[0]]}%</td><td class="n">${r.lvl[LEVELS[1]]}%</td><td class="n">${r.lvl[LEVELS[2]]}%</td><td class="tiny">${esc(weak)}</td><td class="tiny">${esc(r.waktu)}</td></tr>`; }).join('')||'<tr><td colspan="10" class="muted">Belum ada hasil.</td></tr>'}
    </tbody></table></div>`;
  } else if(tab==='butir'){
    content=`<div class="tscroll"><table class="tbl"><thead><tr><th>No</th><th>Teks</th><th>Bentuk</th><th>Subkompetensi</th><th>Benar</th><th>%</th><th>Kesukaran</th></tr></thead><tbody>
     ${items.map(it=>`<tr><td>${it.q.n}</td><td class="tiny">${esc(TEXTS.find(t=>t.n===it.q.t).type)}</td><td class="tiny">${it.q.type==='KAT'?'Kategori':it.q.type}</td><td class="tiny">${esc(it.q.sub)}</td><td class="n">${it.c}/${n}</td><td class="n">${it.p}%</td><td><span class="badge ${it.label==='Sukar'?'red':it.label==='Sedang'?'amber':'green'}">${n?it.label:'–'}</span></td></tr>`).join('')}
    </tbody></table></div><p class="tiny" style="margin-top:8px">Nomor butir = nomor asli (1–30) sesuai naskah/kisi-kisi, bukan urutan acak di layar siswa. Kesukaran: ≥75% mudah, 40–74% sedang, &lt;40% sukar.</p>`;
  } else if(tab==='sub'){
    content=`${subRows.map(s=>`<div class="bar"><span class="tiny">${esc(s.sub)}</span><div class="track"><i class="${cls(s.p)}" style="width:${s.p}%"></i></div><span class="val">${s.p}%</span></div>`).join('')}
     <h3 style="margin-top:14px">Rekomendasi tindak lanjut</h3>${n?`<ol class="instr">${subRows.slice(0,3).map(s=>`<li><b>${esc(s.sub)}</b> (${s.lvl}, ${s.p}%): ${tipFor(s.sub)}</li>`).join('')}</ol>`:'<p class="muted">Belum ada data.</p>'}`;
  } else if(tab==='alat'){
    content=`<div class="switch"><input type="checkbox" id="swExp" ${settings.showPembahasan?'checked':''}><label for="swExp">Tampilkan pembahasan di halaman hasil siswa</label></div>
     <p class="tiny">${SERVER?'Pengaturan disimpan di Google Sheets (berlaku untuk semua siswa).':'Pengaturan ini hanya berlaku di perangkat ini.'}</p>
     <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
     <h3>Impor kode hasil</h3><p class="muted">Tempel satu atau beberapa kode (dipisah baris/spasi) yang dikirim siswa.</p>
     <textarea id="imp" rows="4" placeholder="TKAEN.…"></textarea><div class="row" style="margin-top:8px"><button id="doImp">Impor</button><span id="impMsg" class="muted"></span></div>
     <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
     <h3>Ekspor</h3><div class="row"><button id="csv">Unduh CSV</button><button id="csvCopy" class="ghost">Salin CSV</button></div>
     <p class="tiny">Kolom: identitas, nilai, % per level, jawaban benar/salah tiap butir (B1–B30).</p>
     ${SERVER?`<p class="tiny">Data lengkap juga tersedia di Google Sheets (lembar "Hasil").</p>`:`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><h3>Hapus data</h3><button class="warn" id="wipe">Hapus semua hasil di perangkat ini</button>`}`;
  }
  app.innerHTML=`<div class="topbar"><div><div class="title">Dasbor Guru – Tryout TKA Bahasa Inggris</div><div class="sub">${SERVER?'Sumber: Google Sheets (diperbarui tiap 20 detik)':'Sumber: perangkat ini'}</div></div><a href="#" style="margin-left:auto;color:#fff;font-size:.85rem" id="logout">Keluar</a></div>
  <div class="wrap">
   <div class="card"><div class="row"><label class="muted" for="kf">Kelas</label><select id="kf" style="width:auto"><option value="">Semua</option>${kelasList.map(k=>`<option ${k===kelasFilter?'selected':''}>${esc(k)}</option>`).join('')}</select><span class="grow"></span><button class="ghost small" id="refresh">Muat ulang</button></div>
    <div class="kpi" style="margin-top:12px"><div class="box"><b>${n}</b><span>Peserta</span></div><div class="box"><b>${avg}</b><span>Rata-rata nilai</span></div>${LEVELS.map((l,i)=>`<div class="box"><b>${lvlAvg[i]}%</b><span>${l.replace('Pemahaman ','').replace(' dan Apresiasi','')}</span></div>`).join('')}</div></div>
   <div class="tabs">${[['siswa','Rekap siswa'],['butir','Analisis butir'],['sub','Subkompetensi'],['alat','Pengaturan & alat']].map(t=>`<button data-tab="${t[0]}" class="${tab===t[0]?'act':''}">${t[1]}</button>`).join('')}</div>
   <div class="card">${content}</div></div>`;
  $('#logout').onclick=()=>{ sessionStorage.removeItem('tka_en_teacher'); sessionStorage.removeItem('tka_en_pin'); };
  $('#kf').onchange=e=>{ sessionStorage.setItem('tka_en_kelas',e.target.value); viewTeacher(); };
  $('#refresh').onclick=()=>viewTeacher();
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ sessionStorage.setItem('tka_en_tab',b.dataset.tab); viewTeacher(); });
  if(tab==='alat'){
    $('#swExp').onchange=async e=>{ const v=e.target.checked; if(SERVER){ try{ const r=await fetch(SERVER,{method:'POST',body:JSON.stringify({action:'settings',pin:sessionStorage.getItem('tka_en_pin')||'',settings:{showPembahasan:v}})}); const j=await r.json(); if(!j.ok) throw new Error(j.error); }catch(err){ alert('Gagal menyimpan: '+err.message); } } else store.set(LS.settings,{showPembahasan:v}); };
    $('#doImp').onclick=async()=>{ const codes=$('#imp').value.split(/\s+/).filter(Boolean); let ok=0,bad=0; const all=SERVER?[]:store.get(LS.results,[]);
      for(const c of codes){ try{ const r=decodeResult(c); if(SERVER){ const x=await fetch(SERVER,{method:'POST',body:JSON.stringify({action:'submit',result:r})}); const j=await x.json(); if(!j.ok) throw new Error(j.error); } else { const i=all.findIndex(z=>z.id===r.id); if(i>=0) all[i]=r; else all.push(r); } ok++; }catch(e){ bad++; } }
      if(!SERVER) store.set(LS.results,all); $('#impMsg').textContent=`${ok} berhasil, ${bad} gagal.`; if(ok) setTimeout(()=>viewTeacher(),800); };
    const csv=()=>{ const head=['Nama','Kelas','Waktu','Durasi(menit)','Skor','Nilai',...LEVELS.map(l=>'%'+l),...QS.map(q=>'B'+q.n)];
      const lines=[head.join(',')]; rows.forEach(r=>lines.push([r.nama,r.kelas,r.waktu,r.durasi,r.score,r.nilai,...LEVELS.map(l=>r.lvl[l]),...QS.map(q=>r.per&&r.per[q.n]?1:0)].map(v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v).join(','))); return lines.join('\n'); };
    $('#csv').onclick=()=>{ const b=new Blob(['﻿'+csv()],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='hasil_tryout_tka_inggris.csv'; a.click(); };
    $('#csvCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(csv()); alert('CSV tersalin. Tempel di Excel/Sheets.'); }catch(e){ alert('Gagal menyalin.'); } };
    const w=$('#wipe'); if(w) w.onclick=()=>{ if(confirm('Hapus SEMUA hasil di perangkat ini?')){ store.del(LS.results); viewTeacher(); } };
  }
  if(SERVER) teacherPoll=setInterval(()=>{ if(location.hash==='#guru' && sessionStorage.getItem('tka_en_tab')!=='alat') viewTeacher(); },20000);
}
function normalizeRow(r){ // rows from server carry same shape; ensure per/lvl exist
  if(!r.per||!r.lvl){ const s=score(r.answers||{}); r.per=s.per; r.score=s.score; r.nilai=s.nilai; r.lvl=Object.fromEntries(LEVELS.map(l=>[l,pct(s.lvl[l].c,s.lvl[l].n)])); }
  return r;
}
function weakestSub(r){ const agg={}; QS.forEach(q=>{ agg[q.sub]=agg[q.sub]||{c:0,n:0}; agg[q.sub].n++; if(r.per&&r.per[q.n]) agg[q.sub].c++; }); let w=null; Object.keys(agg).forEach(k=>{ const p=agg[k].c/agg[k].n; if(!w||p<w.p) w={k,p}; }); return w?w.k:''; }

render();
})();
</script>
</body>
</html>
